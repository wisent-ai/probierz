schemaVersion: 1
appId: slajd
productId: slajd
owner: Slajd maintainers

# The terminal surface of Slajd: the slajd command. A talk is what a person
# presents in front of others with a time limit, so its journeys are the render
# a speaker takes into the room, the review that tells them, before the panel
# does, whether the presentation says what its documents say, and the deck
# Slajd builds itself from a brief and its sources.
repositories:
  - root: ~/Documents/CodingProjects/Wisent/slajd
    mappings:
      - paths:
          - src/talk/**
          - src/render/**
          - src/exhibit/**
          - src/typography/**
          - src/design/**
          - src/theme/**
          - src/submission/**
          - src/main.rs
          - src/api/**
          - src/error.rs
          - Cargo.toml
          - tests/cli/**
          - tests/api/**
          - tests/exhibit/**
        journeys:
          - talk-render
      - paths:
          - src/review/**
          - src/render/**
          - src/main.rs
          - src/api/**
          - tests/review/**
        journeys:
          - presentation-review
      - paths:
          - src/deck/**
          - src/inference/**
          - src/cli/**
          - src/review/**
          - src/render/**
          - src/exhibit/**
          - tests/deck/**
        journeys:
          - deck-create

surfaces:
  tui:
    spec: slajd-*
    journeys:
      - talk-render
      - presentation-review
      - deck-create

journeys:
  talk-render:
    owner: Slajd maintainers
    description: 'A speaker renders a Markdown talk continued in a second file with a backup slide through slajd render with a theme file, gets one PDF page and one PNG per slide and a speaker script holding the backup answer, and a talk over its duration is refused with every slide''s minutes and leaves no PDF.'
    value: 'The talk a speaker presents is checked against its time limit and set by TeX in the speaker''s own theme before it reaches the room, so an overlong talk or a slide that does not fit is caught on the command line instead of in front of the audience.'
  presentation-review:
    owner: Slajd maintainers
    description: 'A speaker has slajd review judge a presentation against the document it presents and the rubric they name, both one Slajd rendered and an external PDF given without a speaker script; every rubric criterion comes back judged with evidence, the report carries the digest of every slide and the source, and a presentation that misstates its source''s cost is not passed and fails source fidelity.'
    value: 'Before a presentation reaches a review panel, wherever it was made, a model that reads the source document checks that every figure on the slides is the document''s own, that the argument holds and that the text does not read as generated, instead of the presenters finding out from the panel.'
  deck-create:
    owner: Slajd maintainers
    description: 'A person gives slajd deck create a brief, a theme, a rubric with its step map and the documents a fictional talk rests on; Slajd builds the evidence, the audience, the governing thought, the strategy, the pillars, the ghost deck, the exhibits and the script through Stado''s inference capability, renders the PDF, measures every gate, has the deck judged by another model and revises until it passes; a brief whose rubric has a dimension its map leaves out is refused before any model is asked.'
    value: 'A person with a talk to give gets a deck fitted to its minutes, audience and occasion, argued answer first and mostly exhibits, never a copy of their documents, judged against the rubric they chose, without building it slide by slide.'
