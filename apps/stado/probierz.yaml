journeys:
  host-dynamic-capacity:
    owner: Stado maintainers
    timeoutMs: 5100000
    value: A host reports live resources without fixed slots, registry writes remove retired caps, and
      a real worker admits two concurrent jobs despite legacy limits of one and records both completions.
  run-retention:
    owner: Stado maintainers
    timeoutMs: 5100000
    value: The coordinator retains and reaps a migrated terminal result, preserves settled cancellation
      history after its run manifest is removed, and refuses missing history for an unretired transition.
  disk-cleanup:
    owner: Stado maintainers
    timeoutMs: 5100000
    value: The disk janitor previews without mutation, enforces only tagged-cache deletion, preserves
      recovery state through live locks, resumes after predecessor lock release, and refuses contradictory
      watch modes.
  release-pipeline:
    owner: Stado maintainers
    timeoutMs: 8100000
    description: Build committed source on a real worker, sign through an isolated real Skarbiec grant,
      publish and install the release, then retry a cancelled build under a distinct job and execute the
      installed binary.
    value: Neither a generated command nor an archive alone counts as delivery; the normal release and
      cancelled-build retry must both install and run the actual product.
  native-build:
    owner: Stado maintainers
    timeoutMs: 5700000
    value: A declared build recipe checks out a public Git ref on a matching worker, retains its completed
      state after coordinator cleanup, and keeps build-output.txt downloadable through repeated cleanup.
  platform-matrix:
    owner: Stado maintainers
    timeoutMs: 7200000
    value: Both darwin-arm64 and linux-amd64 run the native build-artifact journey and complete the signed
      release and cancelled-build retry, installing and executing ci-release-probe from one Stado source
      revision.
  native-readers:
    owner: Stado maintainers
    timeoutMs: 5400000
    value: A real launchd unit whose cached definition runs a private Stado image is reloaded in its observed
      domain after its plist names the delivered root, the replacement maps that root file, and repeated
      convergence does not restart it again.
  service-convergence:
    owner: Stado maintainers
    timeoutMs: 5700000
    description: Exercise authenticated nonlocal Services convergence through the real Stado dashboard
      and an isolated real Skarbiec on the actual hostname, then drive the product Services screen without
      a Wisent session through a dedicated owner-only local registry API token file and the same source-built
      CLI, retaining its failed receipt across refresh.
    value: Read and apply actions remain independently grantable for nonlocal callers; selected and host-wide
      reports preserve their complete exit-code envelope; failed delivery protects existing bytes; and
      the graphical local client resolves its real Skarbiec-backed credential from an owner-only file
      to reach a target deliberately unavailable to CLI fallback, without an account operation or stale
      installed CLI.
  apple-challenge-preparation:
    owner: Stado maintainers
    timeoutMs: 900000
    description: Prepare and observe the signed Apple challenge helper on one explicitly named Stado-managed
      Mac without starting Apple sign-in, CuaDriver, a browser, or notifications.
    value: The real Darwin ARM64 host runs prompt-free Apple-only Accessibility preparation, observes
      the signed helper file state, and reports fresh GUI-automation status from the same host.
    prerequisites:
      platform: The selected Stado target must be a real Darwin ARM64 host.
      host: STADO_APPLE_PREPARATION_HOST must explicitly name that target; there is no default or simulated
        substitute.
      safety: The journey must not start Apple sign-in, CuaDriver, a browser, or notifications.
  apple-challenge-readiness:
    owner: Stado maintainers
    timeoutMs: 900000
    description: Read the registered Apple helper's real file, Accessibility, and prompt-free preflight
      state without preparing it or repeating a prior mutation.
    value: A source-bound Stado command observes the existing helper in its declared Aqua session; the
      retained command and output distinguish ready state, refusal, timeout, and interrupted evidence.
    prerequisites:
      platform: The selected Stado target must be a real Darwin ARM64 host.
      host: STADO_APPLE_PREPARATION_HOST explicitly names the registered Apple host.
      safety: No preparation, Apple sign-in, consent window, notification, browser, or CuaDriver launch
        is permitted.
  apple-challenge-desktop:
    owner: Stado maintainers
    timeoutMs: 900000
    description: Prepare the registered Apple helper from the real Stado Desktop Hosts screen through
      its configured native API, using only already-authorized CUA access.
    value: The selected real host reports prompt-free Apple helper readiness and the native screen retains
      its complete result or exact refusal; no Apple authentication or permission grant is attempted.
    prerequisites:
      host: STADO_APPLE_PREPARATION_HOST explicitly names the registered Apple host.
      desktop: The selected dedicated Mac must already have CuaDriver access and a configured real Stado
        API.
  onboarding-first-use:
    owner: Stado Desktop maintainers
    timeoutMs: 600000
    description: Explain Stado's observe-first fleet model, resume the persisted explanation, and finish
      only when the live dashboard reports an authorized completed job.
    value: A fresh operator reaches the console and inspects a real authorized job outcome rather than
      treating deployment or navigation as success.
    journeyId: first-use
    journeyVersion: 2026-08-04.1
    journeyVersionId: 10000000-0000-4000-8000-000000000004
    firstSuccessFact: authorized_job_completed
    completionEvidence:
      state: the device-scoped journey is completed only after completedRecent contains a real job
      event: authorized_job_completed is emitted by the completed-job observation hook
      productArtifact: the exact authorized job ID is visible in the Jobs completed-outcomes table
    requiredConditions:
    - The installed ai.wisent.stado build is produced from the mapped Stado source revision
    - A dedicated authenticated subject has fresh onboarding progress and read access to a real Stado
      dashboard snapshot
    - PROBIERZ_STADO_COMPLETED_JOB_ID identifies an authorized completed job visible in that snapshot
    publication:
      screenId: first_success
      artifactKinds:
      - screenshot
      - recording
      - trace
      minimumEvidence: E3
      redactionRequired: true
  azure-subscription-recovery:
    owner: Stado maintainers
    timeoutMs: 240000
    description: Verify the recovered Azure subscription through Stado by applying its idempotent required
      RBAC, proving no role assignment failed, and confirming that no deny assignment remains.
  release-logs:
    owner: Stado maintainers
    timeoutMs: 240000
    description: Read a release candidate's own stdout and stderr off the target host and tell a log that
      is missing from one that is present and empty from one that was read.
    value: An operator diagnosing a candidate that died in ninety seconds sees the reason the candidate
      itself wrote, instead of guessing from a rollout phase.
  public-release-channel:
    owner: Stado maintainers
    timeoutMs: 1200000
    description: Through the public HTTPS control origin, use the built Stado binary to stat and download
      one retained native release manifest and archive, verify the archive digest, extract it, and execute
      the released binary.
    value: The route installers and version gates depend on is proven from outside the loopback listener,
      so a running dashboard or configured Funnel cannot be mistaken for a working release channel.
  release-doctor:
    owner: Stado maintainers
    timeoutMs: 240000
    description: One verdict over desired versus observed release, the candidate, the host's quarantine
      map and its claiming gates - blocked when the desired digest is quarantined or the disk gate is
      unresolved, settled only when observed equals desired.
    value: An operator learns whether a rollout will land, and what is holding it, from one read that
      starts nothing and writes nothing.
  release-quarantine:
    owner: Stado maintainers
    timeoutMs: 240000
    description: List the digests a host refuses to roll out again and retire exactly one, refusing a
      clear without a digest or a reason, backing the state up, auditing the change, and restarting nothing.
    value: A quarantined digest has a documented way back that is neither a hand-edit on the host nor
      a burnt version number.
  host-gates:
    owner: Stado maintainers
    timeoutMs: 240000
    description: Say why a host is claiming no work, in the blocker words its own agent publishes, with
      the disk policy behind them and live CPU, memory and accelerator capacity beside the work already
      running.
    value: A host that has stopped claiming work is visible as that, instead of as a healthy host with
      an empty queue or a machine constrained by an operator-set worker count.
  host-reclaim:
    owner: Stado maintainers
    timeoutMs: 300000
    description: Reclaim host disk in three declared stages, previewing by default so a dry run deletes
      nothing, and refusing an apply that carries no reason.
    value: The space comes back through a command that measures each stage and leaves an audit record,
      not through a shell script written during the outage.
  service-converge:
    owner: Stado maintainers
    timeoutMs: 300000
    description: Compare the version a host is declared to run against the version it reports, and report
      whether the live process is executing the artefact its unit declares - binary_matches_process false
      when it is not.
    value: A host whose unit, declared version and installed tree all look correct while the live process
      runs something else is reported as exactly that.
  service-unowned-processes:
    owner: Stado maintainers
    timeoutMs: 240000
    description: Find product processes on a host that no launchd job or systemd unit owns, naming the
      pid, the command, when it started and which product it appears to be.
    value: Two agent processes running for four days with no unit behind them are findable instead of
      invisible to every unit-scoped report.
  service-ensure:
    owner: Stado maintainers
    timeoutMs: 300000
    description: Assert the unit a host must be running, idempotently - refused without a reason, installed
      where absent, and reported already_correct with nothing touched when the host already runs it.
    value: An operator has one command that can be run twice, or from a script, to make a host run what
      it is supposed to run.
  mobile-egress:
    owner: Stado maintainers
    timeoutMs: 1200000
    description: On a Stado-selected host with a trusted phone tether, run the built Stado loopback proxy
      on that interface and require public IP intelligence to identify the realized exit as mobile, not
      hosting, and not a public proxy.
    value: Weles can use a phone exit managed by the normal Stado service lifecycle without mistaking
      a configured interface or listening port for proof that browser traffic leaves through a mobile
      carrier.
  releases-screen:
    owner: Stado Desktop maintainers
    timeoutMs: 300000
    description: The Releases screen loads real rollout state, renders desired against observed with the
      rollout verdict and its blockers, and refuses its mutating action without a typed reason.
  hosts-screen:
    owner: Stado Desktop maintainers
    timeoutMs: 300000
    description: The Hosts screen loads real fleet state, names why a host is claiming nothing beside
      its disk figures, and refuses its reclamation action without a typed reason.
  services-screen:
    owner: Stado Desktop maintainers
    timeoutMs: 300000
    description: The Services screen loads declared services with the revision each host reports and whether
      the live process matches its declared artefact, and offers no mutating control at all - an unowned
      process is reported, and ending it is left to whoever knows what it is doing.
