journeys:
  onboarding-first-use:
    owner: Stado Desktop maintainers
    timeoutMs: 600000
    description: Explain Stado's observe-first fleet model, resume the persisted explanation, and finish only when the live dashboard reports an authorized completed job.
    value: A fresh operator reaches the console and inspects a real authorized job outcome rather than treating deployment or navigation as success.
    journeyId: first-use
    journeyVersion: 2026-08-04.1
    journeyVersionId: 10000000-0000-4000-8000-000000000004
    firstSuccessFact: authorized_job_completed
    completionEvidence:
      state: the device-scoped journey is completed only after completedRecent contains a real job
      event: authorized_job_completed is emitted by the completed-job observation hook
      productArtifact: the exact authorized job ID is visible in the Jobs completed-outcomes table
    requiredConditions:
      - The installed ai.wisent.stado build is produced from the mapped Stado source revision
      - A dedicated authenticated subject has fresh onboarding progress and read access to a real Stado dashboard snapshot
      - PROBIERZ_STADO_COMPLETED_JOB_ID identifies an authorized completed job visible in that snapshot
    publication:
      screenId: first_success
      artifactKinds: [screenshot, recording, trace]
      minimumEvidence: E3
      redactionRequired: true
  azure-subscription-recovery:
    owner: Stado maintainers
    timeoutMs: 240000
    description: Verify the recovered Azure subscription through Stado by applying its idempotent required RBAC, proving no role assignment failed, and confirming that no deny assignment remains.
  release-logs:
    owner: Stado maintainers
    timeoutMs: 240000
    description: Read a release candidate's own stdout and stderr off the target host and tell a log that is missing from one that is present and empty from one that was read.
    value: An operator diagnosing a candidate that died in ninety seconds sees the reason the candidate itself wrote, instead of guessing from a rollout phase.
  public-release-channel:
    owner: Stado maintainers
    timeoutMs: 1200000
    description: Through the public HTTPS control origin, use the built Stado binary to stat and download one retained native release manifest and archive, verify the archive digest, extract it, and execute the released binary.
    value: The route installers and version gates depend on is proven from outside the loopback listener, so a running dashboard or configured Funnel cannot be mistaken for a working release channel.
  release-doctor:
    owner: Stado maintainers
    timeoutMs: 240000
    description: One verdict over desired versus observed release, the candidate, the host's quarantine map and its claiming gates - blocked when the desired digest is quarantined or the disk gate is unresolved, settled only when observed equals desired.
    value: An operator learns whether a rollout will land, and what is holding it, from one read that starts nothing and writes nothing.
  release-quarantine:
    owner: Stado maintainers
    timeoutMs: 240000
    description: List the digests a host refuses to roll out again and retire exactly one, refusing a clear without a digest or a reason, backing the state up, auditing the change, and restarting nothing.
    value: A quarantined digest has a documented way back that is neither a hand-edit on the host nor a burnt version number.
  host-gates:
    owner: Stado maintainers
    timeoutMs: 240000
    description: Say why a host is claiming no work, in the blocker words its own agent publishes, with the disk policy behind them and live CPU, memory and accelerator capacity beside the work already running.
    value: A host that has stopped claiming work is visible as that, instead of as a healthy host with an empty queue or a machine constrained by an operator-set worker count.
  host-reclaim:
    owner: Stado maintainers
    timeoutMs: 300000
    description: Reclaim host disk in three declared stages, previewing by default so a dry run deletes nothing, and refusing an apply that carries no reason.
    value: The space comes back through a command that measures each stage and leaves an audit record, not through a shell script written during the outage.
  service-converge:
    owner: Stado maintainers
    timeoutMs: 300000
    description: Compare the version a host is declared to run against the version it reports, and report whether the live process is executing the artefact its unit declares - binary_matches_process false when it is not.
    value: A host whose unit, declared version and installed tree all look correct while the live process runs something else is reported as exactly that.
  service-unowned-processes:
    owner: Stado maintainers
    timeoutMs: 240000
    description: Find product processes on a host that no launchd job or systemd unit owns, naming the pid, the command, when it started and which product it appears to be.
    value: Two agent processes running for four days with no unit behind them are findable instead of invisible to every unit-scoped report.
  service-ensure:
    owner: Stado maintainers
    timeoutMs: 300000
    description: Assert the unit a host must be running, idempotently - refused without a reason, installed where absent, and reported already_correct with nothing touched when the host already runs it.
    value: An operator has one command that can be run twice, or from a script, to make a host run what it is supposed to run.
  mobile-egress:
    owner: Stado maintainers
    timeoutMs: 1200000
    description: On a Stado-selected host with a trusted phone tether, run the built Stado loopback proxy on that interface and require public IP intelligence to identify the realized exit as mobile, not hosting, and not a public proxy.
    value: Weles can use a phone exit managed by the normal Stado service lifecycle without mistaking a configured interface or listening port for proof that browser traffic leaves through a mobile carrier.
  native-build:
    owner: Stado maintainers
    timeoutMs: 1200000
    description: Write a native build recipe, let the coordinator observe the public Git branch, let a real platform-matching Stado worker claim and execute the job, and download the artifact whose bytes the recipe produced.
    value: A recipe, queued job, and successful process exit are not mistaken for a build until the declared artifact is present and readable from canonical Stado results.
  release-pipeline:
    owner: Stado maintainers
    timeoutMs: 1800000
    description: Build committed source on a real Stado worker, qualify it, read the signing key through a real isolated Skarbiec grant, sign and publish immutable candidate bytes, install them, and execute the installed binary.
    value: Build, signing, publication, and delivery are proven as one release path without replacing Skarbiec or stopping at a generated manifest.
  platform-matrix:
    owner: Stado maintainers
    timeoutMs: 3600000
    description: On the live darwin-arm64 and linux-amd64 fleet workers, clone the exact Stado revision and run the native build and complete signed release journeys with a real isolated Skarbiec.
    value: Both supported release platforms produce readable build artifacts and complete signing, publication, installation, and execution instead of inheriting confidence from a macOS-only run.
  releases-screen:
    owner: Stado Desktop maintainers
    timeoutMs: 300000
    description: The Releases screen loads real rollout state, renders desired against observed with the rollout verdict and its blockers, and refuses its mutating action without a typed reason.
  hosts-screen:
    owner: Stado Desktop maintainers
    timeoutMs: 300000
    description: The Hosts screen loads real fleet state, names why a host is claiming nothing beside its disk figures, and refuses its reclamation action without a typed reason.
  services-screen:
    owner: Stado Desktop maintainers
    timeoutMs: 300000
    description: The Services screen loads declared services with the revision each host reports and whether the live process matches its declared artefact, and offers no mutating control at all - an unowned process is reported, and ending it is left to whoever knows what it is doing.
secretRefs:
  STADO_MODEL_ROUTER_TOKEN: vault://wisent/probierz/model-router-token
  PROBIERZ_MODEL_AGENT_SECRET: vault://wisent/probierz/model-agent-secret
artifacts:
  retain:
    pullRequestDays: 14
    nightlyDays: 30
    adhocDays: 7
  redact: [TOKEN, SECRET, PASSWORD, KEY, COOKIE, AUTH, EMAIL, JOB]
  pii: possible
pullRequestPolicy:
  minimumEvidence: E3
  requiredJourneys: [onboarding-first-use]
  requiredTargets: [desktop:mac]
  requireSecretScan: true
releasePolicy:
  minimumEvidence: E3
  requiredJourneys: [onboarding-first-use]
  requiredTargets: [desktop:mac]
  requireProtectedArtifacts: true
  requireSecretScan: true
