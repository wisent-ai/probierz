schemaVersion: 1
appId: stado
productId: stado
owner: Stado maintainers
repositories:
  - root: /Users/lukaszbartoszcze/Documents/CodingProjects/Wisent/stado
    mappings:
      - paths:
          - stado-rs/src/cli/host.rs
          - stado-rs/src/deploy/host_gates.rs
          - stado-rs/src/providers/local/agent.rs
          - stado-rs/src/providers/local/helpers.rs
          - stado-rs/src/queue/capacity.rs
          - desktop/StadoDesktop/Sources/Stado/HostsView.swift
          - desktop/StadoDesktop/Sources/Stado/OperationsModels.swift
          - docs/cli.md
          - docs/configuration.md
          - desktop/StadoDesktop/tests/fleet/WorkerNodeCapacityTests.swift
          - desktop/StadoDesktop/scripts/bundle.sh
        journeys: [host-dynamic-capacity]
      - paths:
          - stado-rs/src/monitor/reap.rs
          - stado-rs/src/queue/runs.rs
          - stado-rs/tests/run_history/**
        journeys: [run-retention]

surfaces:
  tui:
    spec: stado-host-gates.spec.mjs
    journeys: [host-dynamic-capacity, run-retention]
    journeyOverrides:
      - when: {PROBIERZ_JOURNEY: host-dynamic-capacity}
        journeys: [host-dynamic-capacity]
      - when: {PROBIERZ_JOURNEY: run-retention}
        journeys: [run-retention]
    conditions:
      TUI_CMD: /Users/lukaszbartoszcze/Documents/CodingProjects/Wisent/stado/stado-rs/target/release/stado
  desktop:cua:
    spec: stado-hosts-screen.spec.mjs
    journeys: [host-dynamic-capacity]

journeys:
  host-dynamic-capacity:
    owner: Stado maintainers
    timeoutMs: 240000
    value: A host reports live CPU, memory, disk, accelerator, and active-workload capacity without exposing or enforcing a fixed worker-slot count.
  run-retention:
    owner: Stado maintainers
    timeoutMs: 600000
    value: The coordinator retains and reaps the exact terminal result of a migrated durable run whose historical job predates submission-linkage fields, while conflicting linkage remains refused.

artifacts:
  retain:
    pullRequestDays: 14
    nightlyDays: 30
    adhocDays: 30
  redact: [TOKEN, SECRET, PASSWORD, KEY, COOKIE, AUTH]
  pii: unlikely

pullRequestPolicy:
  minimumEvidence: E2
  requireSecretScan: true
releasePolicy:
  minimumEvidence: E2
  requiredJourneys: [host-dynamic-capacity, run-retention]
  requiredTargets: [tui, desktop:cua]
  requireSecretScan: true
