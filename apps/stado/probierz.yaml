        journeys: [mobile-egress]
      - when: {PROBIERZ_JOURNEY: native-build}
        journeys: [native-build]
      - when: {PROBIERZ_JOURNEY: release-pipeline}
        journeys: [release-pipeline]
      - when: {PROBIERZ_JOURNEY: platform-matrix}
        journeys: [platform-matrix]
      - when: {PROBIERZ_JOURNEY: azure-subscription-recovery}
        journeys: [azure-subscription-recovery]
