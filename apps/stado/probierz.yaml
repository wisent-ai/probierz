      - when: {PROBIERZ_JOURNEY: release-doctor}
        journeys: [release-doctor]
      - when: {PROBIERZ_JOURNEY: release-quarantine}
        journeys: [release-quarantine]
      - when: {PROBIERZ_JOURNEY: host-gates}
        journeys: [host-gates]
      - when: {PROBIERZ_JOURNEY: host-reclaim}
        journeys: [host-reclaim]
      - when: {PROBIERZ_JOURNEY: service-converge}
        journeys: [service-converge]
      - when: {PROBIERZ_JOURNEY: service-unowned-processes}
        journeys: [service-unowned-processes]
      - when: {PROBIERZ_JOURNEY: service-ensure}
        journeys: [service-ensure]
