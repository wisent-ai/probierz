surfaces:
  tui:
    spec: stado-journeys.spec.mjs
    journeys: [host-dynamic-capacity, run-retention, disk-cleanup, release-pipeline, service-convergence]
    journeyOverrides:
      - when: {PROBIERZ_JOURNEY: host-dynamic-capacity}
        journeys: [host-dynamic-capacity]
      - when: {PROBIERZ_JOURNEY: run-retention}
        journeys: [run-retention]
      - when: {PROBIERZ_JOURNEY: disk-cleanup}
        journeys: [disk-cleanup]
      - when: {PROBIERZ_JOURNEY: release-pipeline}
        journeys: [release-pipeline]
      - when: {PROBIERZ_JOURNEY: native-build}
        journeys: [native-build]
      - when: {PROBIERZ_JOURNEY: platform-matrix}
        journeys: [platform-matrix]
      - when: {PROBIERZ_JOURNEY: native-readers}
        journeys: [native-readers]
      - when: {PROBIERZ_JOURNEY: service-convergence}
        journeys: [service-convergence]
      - when: {PROBIERZ_JOURNEY: apple-challenge-preparation}
        journeys: [apple-challenge-preparation]
      - when: {PROBIERZ_JOURNEY: cli-release-qualification}
        journeys: [host-dynamic-capacity, run-retention, disk-cleanup, native-build, release-pipeline, service-convergence]
      - when: {PROBIERZ_JOURNEY: darwin-release-qualification}
        journeys: [host-dynamic-capacity, run-retention, disk-cleanup, native-build, release-pipeline, service-convergence, native-readers]
    conditions:
      TUI_CMD: /Users/lukaszbartoszcze/Documents/CodingProjects/Wisent/stado-native-release23/stado-rs/target/release/stado
  desktop:cua:
    spec: stado-hosts-screen.spec.mjs
    journeys: [host-dynamic-capacity, service-convergence]
    journeyOverrides:
      - when: {PROBIERZ_JOURNEY: host-dynamic-capacity}
        journeys: [host-dynamic-capacity]
      - when: {PROBIERZ_JOURNEY: service-convergence}
        journeys: [service-convergence]
      - when: {PROBIERZ_JOURNEY: apple-challenge-desktop}
        journeys: [apple-challenge-desktop]

journeys:
  host-dynamic-capacity:
    owner: Stado maintainers
    timeoutMs: 600000
    value: A host reports live resources without fixed slots, registry writes remove retired caps, and a real worker admits two concurrent jobs despite legacy limits of one and records both completions.
  run-retention:
    owner: Stado maintainers
    timeoutMs: 600000
    value: The coordinator retains and reaps a migrated terminal result, preserves settled cancellation history after its run manifest is removed, and refuses missing history for an unretired transition.
  disk-cleanup:
    owner: Stado maintainers
    timeoutMs: 600000
    value: The disk janitor previews without mutation, enforces only tagged-cache deletion, preserves recovery state through live locks, resumes after predecessor lock release, and refuses contradictory watch modes.
  release-pipeline:
    owner: Stado maintainers
    timeoutMs: 3600000
    description: Build committed source on a real worker, sign through an isolated real Skarbiec grant, publish and install the release, then retry a cancelled build under a distinct job and execute the installed binary.
    value: Neither a generated command nor an archive alone counts as delivery; the normal release and cancelled-build retry must both install and run the actual product.
  native-build:
    owner: Stado maintainers
    timeoutMs: 3600000
    value: A declared build recipe checks out a public Git ref on a matching worker, uploads build-output.txt, and the CLI downloads and verifies its bytes.
  platform-matrix:
    owner: Stado maintainers
    timeoutMs: 7200000
    value: Both darwin-arm64 and linux-amd64 run the native build-artifact journey and complete the signed release and cancelled-build retry, installing and executing ci-release-probe from one Stado source revision.
  native-readers:
    owner: Stado maintainers
    timeoutMs: 900000
    value: A real launchd unit whose cached definition runs a private Stado image is reloaded in its observed domain after its plist names the delivered root, the replacement maps that root file, and repeated convergence does not restart it again.
  service-convergence:
    owner: Stado maintainers
    timeoutMs: 1200000
    description: Exercise authenticated nonlocal Services convergence through the real Stado dashboard and an isolated real Skarbiec on the actual hostname, then drive the product Services screen without a Wisent session through a dedicated owner-only local registry API token file and the same source-built CLI, retaining its failed receipt across refresh.
    value: Read and apply actions remain independently grantable for nonlocal callers; selected and host-wide reports preserve their complete exit-code envelope; failed delivery protects existing bytes; and the graphical local client resolves its real Skarbiec-backed credential from an owner-only file to reach a target deliberately unavailable to CLI fallback, without an account operation or stale installed CLI.
  apple-challenge-preparation:
    owner: Stado maintainers
    timeoutMs: 900000
    description: Prepare and observe the signed Apple challenge helper on one explicitly named Stado-managed Mac without starting Apple sign-in, CuaDriver, a browser, or notifications.
    value: The real Darwin ARM64 host runs prompt-free Apple-only Accessibility preparation, observes the signed helper file state, and reports fresh GUI-automation status from the same host.
    prerequisites:
      platform: The selected Stado target must be a real Darwin ARM64 host.
      host: STADO_APPLE_PREPARATION_HOST must explicitly name that target; there is no default or simulated substitute.
      safety: The journey must not start Apple sign-in, CuaDriver, a browser, or notifications.
  apple-challenge-desktop:
    owner: Stado maintainers
    timeoutMs: 900000
    description: Prepare the registered Apple helper from the real Stado Desktop Hosts screen through its configured native API, using only already-authorized CUA access.
    value: The selected real host reports prompt-free Apple helper readiness and the native screen retains its complete result or exact refusal; no Apple authentication or permission grant is attempted.
    prerequisites:
      host: STADO_APPLE_PREPARATION_HOST explicitly names the registered Apple host.
      desktop: The selected dedicated Mac must already have CuaDriver access and a configured real Stado API.

artifacts:
  retain:
    pullRequestDays: 14
    nightlyDays: 30
    adhocDays: 30
  redact: [TOKEN, SECRET, PASSWORD, KEY, COOKIE, AUTH]
  pii: unlikely

pullRequestPolicy:
  minimumEvidence: E2
  requireSecretScan: false
releasePolicy:
  minimumEvidence: E2
  requiredJourneys: [host-dynamic-capacity, run-retention, disk-cleanup, release-pipeline, service-convergence]
  requiredTargets: [tui, desktop:cua]
  requireSecretScan: false
