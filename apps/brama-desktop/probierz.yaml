schemaVersion: 1
appId: brama-desktop
productId: brama-desktop
owner: Brama Desktop maintainers
repositories:
  - root: /Users/lukaszbartoszcze/Documents/CodingProjects/Wisent/brama-desktop
    mappings:
      - paths:
          - Sources/BramaDesktop/**
          - App/Info.plist
          - App/BramaRuntime.revision
          - Scripts/build-app.sh
          - Package.swift
          - Package.resolved
        journeys: [critical-operations]
      - paths:
          - Sources/BramaDesktop/SubscriptionPoolScreen.swift
          - Sources/BramaDesktop/BramaSubscriptionPoolClient.swift
          - Sources/BramaDesktop/BramaStore.swift
        journeys: [subscription-pool-screen]
surfaces:
  desktop:mac:
    spec: brama-desktop-critical-operations.e2e.ts
    journeys: [critical-operations]
    conditions:
      PROBIERZ_DATA_STATE: fresh
    device:
      platform: macOS
      minimumVersion: "14"
    recording:
      primary: appium-mac2
  desktop:cua:
    spec: brama-desktop-*.spec.mjs
    journeys: [subscription-pool-screen]
    conditions:
      CUA_APP_EXECUTABLE: /Users/lukaszbartoszcze/Documents/CodingProjects/Wisent/brama-desktop/.build/Brama.app/Contents/MacOS/Brama
journeys:
  critical-operations:
    owner: Brama Desktop maintainers
    timeoutMs: 300000
    description: Start the exact Brama Desktop bundle on a dedicated macOS host, prove the bundled Brama runtime becomes operational, complete add-replace-delete for a Keychain provider key, and complete add-replace-delete for a route alias through the native UI.
    value: An operator can launch Brama Desktop and complete both mutable standalone administration lifecycles without exposing either provider key.
    journeyId: critical-operations
    journeyVersion: 2026-08-25.1
    journeyVersionId: DD6681C9-E023-47D8-B213-CC62D579931C
    firstSuccessFact: provider_key_and_route_alias_lifecycles_verified
    completionEvidence:
      state: the replacement provider key became the exact durable Keychain value, then the key and uniquely named alias were both absent after deletion
      event: the real native UI completed add, replace, and delete actions for both resources
      productArtifact: the exact Brama.app bundle and its bundled brama-runtime executable
    requiredConditions:
      - The tested ai.wisent.brama.desktop bundle is built from the mapped Brama Desktop source revision
      - The Stado-selected macOS worker starts from fresh Brama Desktop state
      - Both provider credentials are collision-resistant synthetic values and must never be accepted as evidence for a real provider call
    publication:
      screenId: brama-private-runtime-operational
      artifactKinds: [screenshot]
      minimumEvidence: E3
      redactionRequired: true
  subscription-pool-screen:
    owner: Brama Desktop maintainers
    timeoutMs: 300000
    description: The Subscription Pool screen loads the deployment's real subscription state and renders every field it contracts - provider, subscription id, state, expiry and the last redeem error - with no secret material, and refuses its refresh action without a typed reason.
artifacts:
  retain:
    pullRequestDays: 14
    nightlyDays: 30
    adhocDays: 7
  redact: [TOKEN, SECRET, PASSWORD, KEY, COOKIE, AUTH, CREDENTIAL, PATH]
  pii: unlikely
matrix:
  release:
    targets: [desktop:mac]
    record: true
    timeoutMs: 600000
    maximumParallel: 1
    minimumCellEvidence: E3
    maxCells: 1
pullRequestPolicy:
  minimumEvidence: E3
  requiredJourneys: [critical-operations]
  requiredTargets: [desktop:mac]
  requireSecretScan: true
releasePolicy:
  minimumEvidence: E3
  requiredJourneys: [critical-operations]
  requiredTargets: [desktop:mac]
  requiredMatrixProfile: release
  requireProtectedArtifacts: true
  requireSecretScan: true
