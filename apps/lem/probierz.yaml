schemaVersion: 1
appId: lem
productId: lem
owner: Lem maintainers

# The terminal surface of Lem: lem-cli. Its first journey is the talk render,
# because a talk is the one Lem outcome a person uses in front of others with a
# time limit, and its refusals (a talk over its duration, a slide TeX reports
# as overfull) are the ones a speaker meets.
repositories:
  - root: ~/Documents/CodingProjects/Wisent/lem
    mappings:
      - paths:
          - Sources/LemCore/Talk/**
          - Sources/LemCore/Client/LemBackendClient+Talks.swift
          - Sources/LemCLI/CLI/Talk/**
          - Sources/LemCLI/exit/**
          - Sources/LemBackend/Backend/Talk/**
          - Sources/LemBackend/Backend/Route/**
          - Sources/LemCore/Process/**
          - Package.swift
          - tests/talk/**
        journeys:
          - talk-render
          - talk-review

surfaces:
  tui:
    spec: lem-talk-*
    journeys:
      - talk-render
      - talk-review

journeys:
  talk-render:
    owner: Lem maintainers
    description: 'A speaker renders a Markdown talk continued in a second file with a backup slide through lem-cli talk render, gets one PDF page and one PNG per slide and a speaker script holding the backup answer, and a talk over its duration is refused with every slide''s minutes and leaves no PDF.'
    value: 'The talk a speaker presents is checked against its time limit and set by TeX before it reaches the room, so an overlong talk or a slide that does not fit is caught on the command line instead of in front of the audience.'
  talk-review:
    owner: Lem maintainers
    description: 'A speaker renders a talk with lem-cli talk render and has probierz evaluate talk judge its slides and speaker script against the document it presents; every rubric criterion comes back judged with evidence and the report carries the digest of every slide and the script, and a talk that misstates its source''s cost is not passed and fails source fidelity.'
    value: 'Before a talk reaches a review panel, a model that reads the source document checks that every figure on the slides is the document''s own, that the argument holds and that the text does not read as generated, instead of the presenters finding out from the panel.'
