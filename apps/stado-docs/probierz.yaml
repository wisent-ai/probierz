schemaVersion: 1
appId: stado-docs
productId: stado
owner: Stado maintainers
repositories:
  - root: /Users/lukaszbartoszcze/Documents/CodingProjects/Wisent/stado-landing
    mappings:
      - paths:
          - scripts/generate-cli-docs.mjs
          - tests/docs/cli-scoped-generation.probierz.spec.mjs
        journeys: [cli-scoped-generation]
      - paths:
          - scripts/generate-cli-docs.mjs
          - src/content/cli-commands.json
          - src/pages/docs/**
          - tests/docs/cli-commands.probierz.spec.mjs
        journeys: [cli-command-pages]
surfaces:
  tui:
    spec: stado-cli-docs.spec.mjs
    journeys: [cli-scoped-generation, cli-command-pages]
journeys:
  cli-scoped-generation:
    owner: Stado maintainers
    timeoutMs: 180000
    value: The real documentation generator refreshes a complete selected command tree from STADO_BIN, preserves unrelated pages, and refuses malformed or unknown paths without changing its output.
  cli-command-pages:
    owner: Stado maintainers
    timeoutMs: 600000
    value: The public Stado CLI index links every generated command, and each route serves its documented invocation and options under its canonical URL.
artifacts:
  retain:
    pullRequestDays: 14
    nightlyDays: 30
    adhocDays: 30
pullRequestPolicy:
  minimumEvidence: E2
  requiredTargets: [tui]
  requiredJourneys: [cli-command-pages]
