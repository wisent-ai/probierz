  cli-command-pages:
    owner: Stado maintainers
    timeoutMs: 600000
    value: The public Stado CLI index links every generated command, and each route serves its documented invocation under its canonical URL.
artifacts:
  retain:
    pullRequestDays: 14
    nightlyDays: 30
    adhocDays: 30
