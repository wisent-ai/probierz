schemaVersion: 1
appId: stado-docs
productId: stado
owner: Stado maintainers
repositories:
  - root: /Users/lukaszbartoszcze/Documents/CodingProjects/Wisent/stado-landing
    mappings:
      - paths:
          - scripts/generate-cli-docs.mjs
          - src/content/cli-commands.json
          - src/pages/docs/**
          - tests/docs/cli-commands.probierz.spec.mjs
        journeys: [cli-command-pages]
surfaces:
  tui:
    spec: stado-cli-docs.spec.mjs
    journeys: [cli-command-pages]
