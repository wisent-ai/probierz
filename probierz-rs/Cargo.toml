[package]
name = "probierz"
version = "0.1.5"
edition = "2021"
rust-version = "1.85"
description = "Probierz: journeys run where the product lives, and every run becomes evidence"
license = "Apache-2.0"
autotests = false

[[bin]]
name = "probierz"
path = "src/main.rs"

[[test]]
name = "security_scope"
path = "../tests/security/scope.rs"

[[test]]
name = "security_journey"
path = "../tests/security/journey.rs"
required-features = ["security-live-tests"]

[features]
security-live-tests = []

[[test]]
name = "benchmark_scout"
path = "../tests/benchmark/scout.rs"

[[test]]
name = "benchmark_cycle"
path = "../tests/benchmark/cycle.rs"

[[test]]
name = "benchmark_evidence"
path = "../tests/benchmark/evidence.rs"

[[test]]
name = "benchmark_roadmap"
path = "../tests/benchmark/roadmap.rs"

[[test]]
name = "gate_group"
path = "../tests/gate/group.rs"

[[test]]
name = "author_group"
path = "../tests/author/group.rs"

[[test]]
name = "benchmark_author_group"
path = "../tests/benchmark/author_group.rs"

[[test]]
name = "evaluate_group"
path = "../tests/evaluate/group.rs"

[[test]]
name = "evaluate_talk"
path = "../tests/evaluate/talk.rs"

[[test]]
name = "history_journey"
path = "../tests/history/journey.rs"

[[test]]
name = "incidents_register"
path = "../tests/incidents/register.rs"

[[test]]
name = "repair_model_service"
path = "../tests/repair/model_service.rs"

[[test]]
name = "secrets_group"
path = "../tests/secrets/group.rs"

[[test]]
name = "inspect_names"
path = "../tests/inspect/names.rs"

[[test]]
name = "overview_scan"
path = "../tests/overview/scan.rs"

[[test]]
name = "first_use_stado"
path = "../tests/first-use/stado.rs"

[[test]]
name = "redaction_journey"
path = "../tests/redaction/journey.rs"

[[test]]
name = "suites_run"
path = "../tests/suites/run.rs"

[[test]]
name = "intake_serve"
path = "../tests/intake/serve.rs"

# A result dropped with `let _ =` is a failure nobody hears of: a temporary
# that stays, an audit that was not written, a kill that did not end a
# process. Each such result is handled or said where it arises.
[lints.rust]
unused_must_use = "deny"

[lints.clippy]
let_underscore_must_use = "deny"
# A `match` on a boolean is an if/else written to look like something else.
match_bool = "deny"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
hmac = "0.12"
flate2 = "1"
regex = "1"
url = "2"
uuid = "1"
aes = "0.8"
ctr = "0.9"
ghash = "0.5"
subtle = "2"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ureq = { version = "2", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
fs2 = "0.4.3"
# File mode bits by their POSIX names (S_IRUSR...), never written as octal.
libc = "0.2"
stado-wait = { git = "https://github.com/wisent-ai/stado.git", rev = "692c0438d24117735c61373c0c178f1c1e21b080" }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
