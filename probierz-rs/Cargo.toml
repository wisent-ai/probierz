[package]
name = "probierz"
version = "0.1.5"
edition = "2021"
rust-version = "1.85"
description = "Probierz: journeys run where the product lives, and every run becomes evidence"
license = "Apache-2.0"
autotests = false

[[bin]]
name = "probierz"
path = "src/main.rs"

[[test]]
name = "benchmark_scout"
path = "../tests/benchmark/scout.rs"

[[test]]
name = "benchmark_cycle"
path = "../tests/benchmark/cycle.rs"

[[test]]
name = "gate_group"
path = "../tests/gate/group.rs"

[[test]]
name = "author_group"
path = "../tests/author/group.rs"

[[test]]
name = "evaluate_group"
path = "../tests/evaluate/group.rs"

[[test]]
name = "history_journey"
path = "../tests/history/journey.rs"

[[test]]
name = "secrets_group"
path = "../tests/secrets/group.rs"

[[test]]
name = "inspect_names"
path = "../tests/inspect/names.rs"

[[test]]
name = "overview_scan"
path = "../tests/overview/scan.rs"

[[test]]
name = "first_use_stado"
path = "../tests/first-use/stado.rs"

[[test]]
name = "redaction_journey"
path = "../tests/redaction/journey.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
flate2 = "1"
regex = "1"
url = "2"
aes = "0.8"
ctr = "0.9"
ghash = "0.5"
subtle = "2"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ureq = { version = "2", features = ["json"] }
fs2 = "0.4.3"
stado-wait = { git = "https://github.com/wisent-ai/stado.git", rev = "692c0438d24117735c61373c0c178f1c1e21b080" }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
